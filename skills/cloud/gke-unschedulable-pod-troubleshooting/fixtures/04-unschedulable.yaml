apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-unschedulable-app
  namespace: gke-skills-sandbox
  labels:
    app: test-unschedulable-app
    test-fixture: "04-unschedulable"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-unschedulable-app
  template:
    metadata:
      labels:
        app: test-unschedulable-app
    spec:
      containers:
      - name: giant-container
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "500"
            memory: 500Gi
