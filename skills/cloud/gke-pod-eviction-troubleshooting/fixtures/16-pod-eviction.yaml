apiVersion: v1
kind: Pod
metadata:
  name: test-pod-eviction-app
  namespace: gke-skills-sandbox
  labels:
    app: test-pod-eviction-app
spec:
  restartPolicy: Never
  containers:
  - name: disk-hog
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - "dd if=/dev/zero of=/tmp/bloatfile bs=1M count=15; sleep 20"
    resources:
      requests:
        ephemeral-storage: "5Mi"
      limits:
        ephemeral-storage: "10Mi"
    volumeMounts:
    - mountPath: /tmp
      name: scratch-volume
  volumes:
  - name: scratch-volume
    emptyDir:
      sizeLimit: 10Mi
