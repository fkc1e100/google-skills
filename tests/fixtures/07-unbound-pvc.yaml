apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-unbound-pvc
  namespace: gke-skills-sandbox
  labels:
    test-fixture: "07-unbound-pvc"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: non-existent-test-storage-class
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pvc-app
  namespace: gke-skills-sandbox
  labels:
    app: test-pvc-app
    test-fixture: "07-unbound-pvc"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-pvc-app
  template:
    metadata:
      labels:
        app: test-pvc-app
    spec:
      volumes:
      - name: test-storage
        persistentVolumeClaim:
          claimName: test-unbound-pvc
      containers:
      - name: storage-app-container
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
        - mountPath: /data
          name: test-storage
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
