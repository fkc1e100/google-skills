apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-taint-mismatch-app
  namespace: gke-skills-sandbox
  labels:
    app: test-taint-mismatch-app
    test-fixture: "06-taint-mismatch"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-taint-mismatch-app
  template:
    metadata:
      labels:
        app: test-taint-mismatch-app
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool
      # Note: explicitly omitting toleration for nvidia.com/gpu:NoSchedule taint
      containers:
      - name: gpu-app-container
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
